services:
  postgres:
    image: postgres:16-alpine
    container_name: stempo_postgres
    environment:
      POSTGRES_USER: stempo
      POSTGRES_PASSWORD: stempo_password
      POSTGRES_DB: stempo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stempo -d stempo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stempo_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: stempo
      DB_PASSWORD: stempo_password
      DB_NAME: stempo_db
      JWT_SECRET: your-secret-key-change-in-production
      PORT: 3000
      GIN_MODE: release
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
