version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stempo_postgres
    environment:
      POSTGRES_USER: stempo
      POSTGRES_PASSWORD: stempo_password
      POSTGRES_DB: stempo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stempo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
